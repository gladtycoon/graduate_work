[project]
name = "diplom-work"
version = "0.1.0"
description = "Дипломная работа"
authors = [{name = "Ivan Sokolskiy"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["django (>=6.1,<7.0)", "djangorestframework (>=3.17.2,<4.0.0)", "djangorestframework-simplejwt (>=5.5.1,<6.0.0)", "psycopg2-binary (>=2.9.12,<3.0.0)", "django-cors-headers (>=4.9.0,<5.0.0)", "drf-yasg (>=1.21.15,<2.0.0)", "django-filter (>=26.1,<27.0)", "python-dotenv (>=1.2.2,<2.0.0)", "gunicorn (>=26.0.0,<27.0.0)"]

package-mode = false

[tool.poetry.group.dev.dependencies]
black = "^24.0.0"
isort = "^5.13.0"
flake8 = "^7.0.0"
mypy = "^1.8.0"
ipython = "^8.18.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"